[project]
name = "volumio-yandex-music-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["aiohttp==3.14.5", "yandex-music[async]==3.2.2"]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 100
